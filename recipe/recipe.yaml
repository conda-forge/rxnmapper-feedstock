schema_version: 1

context:
  name: rxnmapper
  version: 0.5.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/rxnmapper-${{ version }}.tar.gz
  sha256: 053c51fedd7900ebe5862185e7b46d80ebc09cb25af14458bd7a3f8addea6947

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=59.2.0,<82
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=1.0.3
    - rxn-chem-utils >=1.0.3
    - scipy >=1.4.1
    - pytorch >=1.5.0
    - transformers >=4.0.0
tests:
  - python:
      imports:
        - rxnmapper
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Reaction atom-mapping from transformers
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/rxn4chemistry/rxnmapper

extra:
  recipe-maintainers:
    - jan-janssen
